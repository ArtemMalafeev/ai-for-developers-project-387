name: OpenCode Triage

on:
  issues:
    types: [opened]

concurrency:
  group: opencode-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  triage:
    if: >-
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'needs-triage') &&
      !contains(github.event.issue.labels.*.name, 'needs-info') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
      !contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout agent skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mattpocock/skills
          ref: 4ae2317ddb22b046e26455e4f9c9b3aaaf62212d # v1.3.2
          path: .agent-skill-source
          persist-credentials: false

      - name: Make agent skills available
        run: |
          mkdir -p .opencode/skills
          cp -R .agent-skill-source/skills/engineering/. .opencode/skills/
          cp -R .agent-skill-source/skills/productivity/. .opencode/skills/
          test "$(find .opencode/skills -name SKILL.md | wc -l | tr -d ' ')" = 27
          printf '%s\n' '/.opencode/skills/' >> .git/info/exclude
          rm -rf .agent-skill-source

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # A GitHub runner cannot answer permission prompts from OpenCode.
          OPENCODE_CONFIG_CONTENT: |-
            {
              "permission": {
                "external_directory": {
                  "*": "deny",
                  "/tmp/*": "allow"
                },
                "doom_loop": "deny",
                "read": {
                  "*.env": "deny",
                  "*.env.*": "deny",
                  "*.env.example": "allow"
                }
              }
            }
        with:
          model: opencode/deepseek-v4.1-flash
          share: false
          prompt: |-
            Ты выполняешь автоматический предварительный триаж нового обращения в репозитории. Работай по навыку `triage` и файлу `docs/agents/triage-labels.md`, но с ограничениями ниже.

            Ограничения:
            - Не меняй код, не создавай спецификацию, не открывай PR и не переключай ветки.
            - Никогда не добавляй метку `ready-for-agent`.
            - Не удаляй существующие метки и не закрывай обращение.
            - Не публикуй отдельный комментарий через `gh issue comment`: твой финальный ответ будет опубликован как комментарий автоматически.
            - Метки меняй только командой `gh issue edit <номер> --add-label <метка>`.

            Что сделать:
            1. Прочитай issue #${{ github.event.issue.number }} и его обсуждение командой `gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --comments`. При необходимости изучи существующее приложение, чтобы понять, не реализовано ли уже запрошенное поведение.
            2. Определи, достаточно ли сведений, чтобы дать предварительный разбор. Не спрашивай то, что можно выяснить по коду.
            3. Если сведений не хватает, добавь метку `needs-info` и задай конкретные проверяемые вопросы автору.
            4. Если сведений достаточно, добавь метку `needs-triage` и дай краткий разбор: категория, суть запроса, затронутые места в коде, риски и открытые вопросы.
            5. Метку категории `bug` или `enhancement` добавляй только если она однозначна.
            6. Начни итоговый ответ ровно с этой строки:
               > *This was generated by AI during triage.*
               Затем напиши разбор по-русски, кратко и по делу. Если ставишь `needs-info`, перечисли вопросы в разделе «Что нужно уточнить».
