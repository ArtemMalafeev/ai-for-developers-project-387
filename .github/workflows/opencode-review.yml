name: OpenCode Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        github.event.pull_request.user.login == 'opencode-agent[bot]'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
      statuses: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenCode CLI
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          archive=/tmp/opencode-linux-x64.tar.gz
          mkdir -p "$HOME/.opencode/bin"
          curl -fsSL -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.opencode/bin" opencode
          chmod +x "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Prepare review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/opencode-review
          context=/tmp/opencode-review/context.md
          {
            printf '# Pull request\n\n'
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,author,baseRefName,headRefName,headRefOid,url
            printf '\n\n# Проверки CI\n\n'
            checks_status=0
            checks="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json name,state,bucket,link,workflow 2>/tmp/opencode-review/checks-error)" || checks_status=$?
            if [ -n "$checks" ]; then
              printf '%s\n' "$checks" | jq 'map(select(.workflow != "OpenCode Review"))'
            else
              printf 'Не удалось получить CI (gh exit %s): ' "$checks_status"
              cat /tmp/opencode-review/checks-error
            fi
            printf '\n# Прогоны Actions для SHA\n\n'
            runs_status=0
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$HEAD_SHA" --limit 20 \
              --json databaseId,name,workflowName,status,conclusion,url,headSha 2>/tmp/opencode-review/runs-error)" || runs_status=$?
            if [ -n "$runs" ]; then
              printf '%s\n' "$runs" | jq 'map(select(.workflowName != "OpenCode Review"))'
            else
              printf 'Не удалось получить прогоны (gh exit %s): ' "$runs_status"
              cat /tmp/opencode-review/runs-error
            fi
            printf '\n# REVIEW.md\n\n'
            if git cat-file -e "$BASE_SHA:REVIEW.md" 2>/dev/null; then
              git show "$BASE_SHA:REVIEW.md"
            else
              printf 'Базовая ветка ещё не содержит REVIEW.md; ниже версия из PR.\n\n'
              cat REVIEW.md
            fi
            printf '\n\n# Diff\n\n'
            git diff --find-renames "$BASE_SHA...$HEAD_SHA"
          } > "$context"
          echo "path=$context" >> "$GITHUB_OUTPUT"

      - name: Run independent review
        id: review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          NO_COLOR: "1"
          CONTEXT_PATH: ${{ steps.context.outputs.path }}
          OPENCODE_CONFIG_CONTENT: |-
            {
              "permission": {
                "*": "deny",
                "read": {
                  "*": "allow",
                  "*.env": "deny",
                  "*.env.*": "deny",
                  "*.env.example": "allow"
                },
                "glob": "allow",
                "grep": "allow",
                "list": "allow",
                "edit": "deny",
                "bash": {
                  "*": "deny",
                  "git status *": "allow",
                  "git log *": "allow",
                  "git show *": "allow",
                  "git diff *": "allow",
                  "git merge-base *": "allow",
                  "git rev-parse *": "allow",
                  "gh pr view *": "allow",
                  "gh pr diff *": "allow",
                  "gh pr checks *": "allow",
                  "gh issue view *": "allow",
                  "gh issue list *": "allow",
                  "gh run list *": "allow",
                  "gh run view *": "allow"
                },
                "external_directory": {
                  "*": "deny",
                  "/tmp/*": "allow"
                },
                "webfetch": "deny",
                "websearch": "deny",
                "task": "deny",
                "todowrite": "deny",
                "question": "deny",
                "doom_loop": "deny"
              }
            }
        run: |
          set -euo pipefail
          review=/tmp/opencode-review/review.md
          cat > /tmp/opencode-review/prompt.md <<'PROMPT'
          Ты — независимый ревьюер pull request. Ты не участвуешь в разработке и не исправляешь код: твоя единственная задача — проверить изменения и вернуть отчёт.

          Входные данные:
          - приложенный файл context.md: описание PR со ссылками, доступные проверки CI, прогоны Actions для HEAD SHA, содержимое REVIEW.md и полный diff;
          - файлы репозитория в текущем checkout.

          Что сделать:
          1. Изучи критерии REVIEW.md из приложенного контекста (версия базовой ветки, а при её отсутствии — версия из PR). Если в описании PR есть ссылки на исходное обращение, спецификацию, согласование человеком или тикеты, открой их разрешёнными командами `gh` и сверь изменения с ними.
          2. Проверь diff и относящийся к нему код. Ищи только подтверждённые дефекты по критериям REVIEW.md, особенно в доступности слотов, пересечениях и границах записей на звонок и повторной записи в занятый слот.
          3. Если ссылка на спецификацию или согласование отсутствует, недоступна или CI ещё не завершён, явно перечисли это в разделе «Недостающий контекст». Не додумывай требования.
          4. Для каждого замечания укажи `file:line`, при каком условии проявляется ошибка и какое последствие для пользователя, данных или работы сервиса. Не включай предположения без подтверждения по коду.
          5. Не дублируй замечания линтеров, форматтеров и уже упавших проверок как отдельные дефекты. Можешь сослаться на них в разделе о CI.
          6. Если подтверждённых дефектов нет, прямо напиши: «Подтверждённых дефектов не найдено».

          Ограничения:
          - Не меняй файлы, не создавай коммиты и ветки, не пушь и не создавай/не редактируй PR.
          - Не публикуй комментарий через `gh pr comment`: отчёт будет опубликован отдельным шагом workflow.
          - Не выполняй команды, изменяющие систему или репозиторий.
          - Пиши по-русски, в Markdown, кратко и структурировано.

          Структура ответа:
          ## Итог
          Краткая оценка и наличие подтверждённых дефектов.
          ## Замечания
          Список замечаний в формате `file:line`, условие ошибки и последствие. Если пусто — «Подтверждённых дефектов не найдено».
          ## Недостающий контекст
          Отсутствующие ссылки, незавершённый CI, недоступные проверки. Если всё есть — «Контекст полный».
          ## Проверки
          Какие проверки CI доступны и их статус; не дублируй их как дефекты.
          PROMPT
          opencode run --format json \
            --model opencode/deepseek-v4.1-flash \
            --file "$CONTEXT_PATH" \
            --title "Авторевью pull request" \
            "$(cat /tmp/opencode-review/prompt.md)" \
            | jq -sr '[.[] | select(.type == "text") | .part.text] | last // empty' > "$review"
          test -s "$review"
          cat "$review"
          echo "path=$review" >> "$GITHUB_OUTPUT"

      - name: Upload review result
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: opencode-review
          path: ${{ steps.review.outputs.path }}
          if-no-files-found: error

  publish:
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download review result
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: opencode-review
          path: /tmp/opencode-review

      - name: Publish review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_PATH: /tmp/opencode-review/review.md
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "PR head changed since review; skipping stale comment"
            exit 0
          fi
          {
            printf '<!-- opencode-review -->\n'
            printf '## Автоматическое ревью OpenCode\n\n'
            printf 'Проверенный head: %s\n\n' "$HEAD_SHA"
            cat "$REVIEW_PATH"
          } > /tmp/opencode-review/comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/opencode-review/comment.md
