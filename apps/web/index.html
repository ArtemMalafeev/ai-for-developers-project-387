<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <script>
      // Ключ намеренно дублирует THEME_STORAGE_KEY в src/lib/useTheme.ts.
      ;(() => {
        const key = 'call-schedule-theme'
        let theme = 'light'
        try {
          const stored = localStorage.getItem(key)
          if (stored === 'dark') theme = 'dark'
          else if (stored !== null && stored !== 'light') localStorage.removeItem(key)
        } catch {
          // Недоступное хранилище оставляет светлую тему.
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь звонков</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
